<!doctype html>
<!-- Transparency is forced inline as well as in CSS so the page never flashes an opaque rectangle over the game. -->
<html lang="en" style="background: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropKit</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
    </style>
  </head>
  <body style="background: transparent !important;">
    <div id="root" style="background: transparent !important;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
